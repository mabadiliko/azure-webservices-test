# Connection details for this project's database on the SHARED Postgres server.
#
# The database and role themselves are infra-owned and live in
# k8s/infra-manifest/postgres/databases/ — CNPG's Database/DatabaseRole must sit
# in the shared cluster's namespace (spec.cluster takes a name, not a namespace).
# This file only materializes the credentials into the project's namespace so its
# workloads can connect.
#
# Prereqs (see docs/onboarding.md → "Add a database"):
#   - infra has committed k8s/infra-manifest/postgres/databases/proj-scoutid.yaml
#   - the password is in Key Vault as `postgres-proj-scoutid-password`
#
# A project that needs its OWN Postgres instance instead (heavy load, a
# different major version, an extension the shared server does not carry) can
# create a CNPG Cluster in this namespace — see docs/postgres.md.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proj-scoutid-db
  namespace: proj-scoutid-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: proj-scoutid-db
    template:
      type: Opaque
      data:
        # Individual fields, plus a ready-made URL for libraries that want one.
        host: shared-rw.postgres.svc.cluster.local
        port: "5432"
        dbname: proj-scoutid
        username: proj-scoutid
        password: "{{ .password }}"
        uri: "postgresql://proj-scoutid:{{ .password }}@shared-rw.postgres.svc.cluster.local:5432/proj-scoutid"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-proj-scoutid-password
