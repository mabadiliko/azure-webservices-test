# AppProject for project DEV applications (optional ArgoCD registration).
# Tighter blast radius than `infra`: this repo only, and the only cluster-scoped
# resource an app may create is its own Namespace. Projects manage everything
# else inside their namespaces however they like.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project dev applications (namespace-scoped, self-managed by projects)
  sourceRepos:
    # NOTE: globstar (**) is required — a single * does not match across '/', so
    # 'https://github.com/*' would NOT match 'https://github.com/org/repo.git'.
    - 'https://github.com/**'      # tighten to the specific org/repo once the slug is confirmed
    # For an OCI chart the registry+namespace IS the repoURL (the chart name is a
    # separate field), so there is nothing after 'charts/' for ** to match — the
    # bare entry is the one that authorises it.
    - 'oci://ghcr.io/scouterna/charts'
    - 'oci://ghcr.io/scouterna/charts/**'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
