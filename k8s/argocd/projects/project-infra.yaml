# AppProject for the INFRA-OWNED per-project resources (namespace, developer
# RBAC, and opt-in shared services like a CloudNativePG database).
#
# This is the privileged boundary: the ApplicationSet in k8s/argocd/projects-root/
# generates one Application per project (from k8s/projects/<project>/infra/) that
# runs under THIS project. A project's OWN workload runs under apps-dev/apps-prod
# instead, which cannot create namespaces, RBAC, databases, or ExternalSecrets.
#
# Blast radius is deliberately wider than apps-dev/apps-prod (it must create
# Namespaces + cluster-scoped RBAC bindings + CNPG clusters) but is still infra-
# owned: only files committed under k8s/projects/*/infra/ land here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Infra-owned per-project resources (namespace, RBAC, shared DBs)
  sourceRepos:
    # NOTE: globstar (**) is required — a single * does not match across '/', so
    # 'https://github.com/*' would NOT match 'https://github.com/org/repo.git'.
    - 'https://github.com/**'     # tighten to the specific org/repo once the slug is confirmed
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  # Cluster-scoped resources these Applications may manage.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  # Namespaced resources. RoleBinding/ServiceAccount for developer access;
  # ExternalSecret for the shared-database credentials. The CNPG + PodMonitor
  # entries are for the escape hatch only — a project that needs its OWN
  # Postgres instance rather than a database on the shared server. The shared
  # server's own Database/DatabaseRole are infra-owned and live in
  # k8s/infra-manifest/postgres/databases/ (CNPG resolves spec.cluster by name
  # within a namespace, so they cannot live here).
  namespaceResourceWhitelist:
    - group: ''
      kind: ServiceAccount
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
    - group: 'postgresql.cnpg.io'
      kind: '*'
    - group: 'external-secrets.io'
      kind: ExternalSecret
    # Scrape config only — a PodMonitor cannot grant access to anything, it just
    # tells Prometheus what to poll. Without this the database PodMonitor is
    # rejected with "not permitted in project".
    - group: 'monitoring.coreos.com'
      kind: PodMonitor
