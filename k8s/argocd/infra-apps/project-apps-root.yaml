# Wave 5 — app-of-apps for HANDED-OVER project workloads.
#
# Recurses k8s/argocd/project-apps/, so infra onboards a project's workload by
# committing one Application manifest there. No kubectl.
#
# Last wave: these depend on the whole platform (Traefik, cert-manager, the
# shared Postgres, monitoring) and on the project's own namespace, which the
# project-infra ApplicationSet creates.
#
# A workload arrives here only at HANDOVER — the project runs it by hand first
# and ArgoCD adopts the live release on first sync. See the README in that
# directory.
#
# prune is ON so deleting a handed-over Application removes its release, but the
# project's namespace and data are NOT in scope here (that is project-infra,
# where prune is off).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-apps-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/mabadiliko/azure-webservices-test.git
    targetRevision: main
    path: k8s/argocd/project-apps
    directory:
      recurse: false
      # Application manifests only — the README is documentation.
      include: '*.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
