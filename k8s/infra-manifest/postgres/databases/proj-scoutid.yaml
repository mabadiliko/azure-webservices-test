# A project's databases on the SHARED Postgres server — dev + prod, the default.
#
# Copy to <project>.yaml, replace proj-scoutid, and commit. The `postgres-databases`
# app syncs this directory.
#
# Everything lives in ONE server, so database and role names must be unique
# across all projects — hence the -dev / -prod suffix. Each environment gets its
# OWN role, so a leaked dev credential cannot reach prod data.
#
# WHY THIS LIVES HERE AND NOT IN k8s/projects/<project>/infra/:
# CNPG's Database and DatabaseRole reference their Cluster by NAME ONLY
# (spec.cluster has no namespace field), so both must live in the shared
# cluster's namespace. Keeping them infra-owned also means a project cannot
# create objects next to another project's database.
#
# Prereqs: the shared cluster is healthy, and BOTH passwords are in Key Vault as
# `postgres-proj-scoutid-dev-password` and `postgres-proj-scoutid-prod-password`
# (see docs/postgres.md).
#
# ONE environment only? Delete the prod block below and drop the `-dev` suffix
# everywhere in what remains. ADDING staging? Copy either block and change the
# suffix — remember its Key Vault password too.
---
# ---------- DEV ----------
# The role's password, from Key Vault. CNPG *consumes* this Secret; it does not
# generate one. basic-auth format with username + password is required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-proj-scoutid-dev-role
  namespace: postgres
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: postgres-proj-scoutid-dev-role
    template:
      type: kubernetes.io/basic-auth
      data:
        username: proj-scoutid-dev
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-proj-scoutid-dev-password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: proj-scoutid-dev
  namespace: postgres
spec:
  cluster:
    name: shared
  ensure: present
  name: proj-scoutid-dev
  login: true
  passwordSecret:
    name: postgres-proj-scoutid-dev-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: proj-scoutid-dev
  namespace: postgres
spec:
  cluster:
    name: shared
  ensure: present
  name: proj-scoutid-dev
  owner: proj-scoutid-dev
  # retain: dropping the Database resource must not drop the project's data.
  databaseReclaimPolicy: retain
---
# ---------- PROD ----------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-proj-scoutid-prod-role
  namespace: postgres
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: postgres-proj-scoutid-prod-role
    template:
      type: kubernetes.io/basic-auth
      data:
        username: proj-scoutid-prod
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-proj-scoutid-prod-password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: proj-scoutid-prod
  namespace: postgres
spec:
  cluster:
    name: shared
  ensure: present
  name: proj-scoutid-prod
  login: true
  passwordSecret:
    name: postgres-proj-scoutid-prod-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: proj-scoutid-prod
  namespace: postgres
spec:
  cluster:
    name: shared
  ensure: present
  name: proj-scoutid-prod
  owner: proj-scoutid-prod
  databaseReclaimPolicy: retain
